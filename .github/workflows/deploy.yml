name: Deploy Astro to VPS

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "src/content/**"
      - ".github/workflows/deploy.yml"
      - "tests/**"
      - "playwright.config.ts"
      - "lighthouserc.cjs"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test

      - name: Lighthouse
        run: npm run audit:lighthouse

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-quality-reports
          path: |
            .lighthouseci/
            test-results/
            playwright-report/
          retention-days: 14

      - name: Setup SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "PORT=$PORT" >> $GITHUB_ENV

      - name: Prepare remote directories
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/releases'"

      - name: Rsync release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rsync -az --delete -e "ssh -p $PORT" ./dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/releases/${{ github.sha }}/"

      - name: Activate release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "ln -sfn '$DEPLOY_PATH/releases/${{ github.sha }}' '$DEPLOY_PATH/current' && (sudo systemctl reload nginx || true)"
